# Drop-in for the Grafana unit that serves the boards: the password of the
# etfpair data source. The file is optional (the leading dash): without it
# Grafana still starts and only this data source fails. deploy/install.sh
# installs this file as /etc/systemd/system/dashboard-grafana.service.d/etf-pair.conf.
[Service]
EnvironmentFile=-/home/ubuntu/code/etf-pair-arbitrage/dashboard/grafana.env
